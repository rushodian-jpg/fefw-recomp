# Builds fefw_rt.dll (the runtime; no game code or data) from this branch, for testing a change before a release has it.
name: Build fefw_rt.dll
on:
  push:
    branches: [build/rt-dll]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 23 or newer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # the newest release (23 or newer) that has the Windows installer: a point release may not have it yet
          $tags = gh release list -R llvm/llvm-project --limit 30 --exclude-pre-releases --json tagName -q '.[].tagName'
          $exe = $null
          foreach ($tag in $tags) {
              $ver = $tag -replace '^llvmorg-', ''
              if ($ver -notmatch '^\d+\.' -or [int]($ver.Split('.')[0]) -lt 23) { continue }
              $names = gh release view $tag -R llvm/llvm-project --json assets -q '.assets[].name'
              $name = $names | Where-Object { $_ -match '^LLVM-.*win64\.exe$' } | Select-Object -First 1
              if ($name) {
                  Write-Host "LLVM $ver`: $name"
                  gh release download $tag -R llvm/llvm-project -p $name -D $env:RUNNER_TEMP
                  if ($LASTEXITCODE) { throw "download failed" }
                  $exe = Join-Path $env:RUNNER_TEMP $name
                  break
              }
              Write-Host "LLVM $ver has no Windows installer; its Windows assets: $(($names | Where-Object { $_ -match 'win' }) -join ', ')"
          }
          if (-not $exe) { throw "no LLVM release from 23 on with a win64 installer" }
          Start-Process $exe -ArgumentList '/S', '/D=C:\LLVM23' -Wait
          & 'C:\LLVM23\bin\clang-cl.exe' --version
          "NX_LLVM_BIN=C:\LLVM23\bin" >> $env:GITHUB_ENV
      - name: Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          ninja --version
      - name: Texture transcoder sources
        shell: pwsh
        run: pwsh -File tools\textures\scripts\fetch_third_party.ps1
      - name: Build fefw_rt.dll
        shell: pwsh
        run: pwsh -File game-build\scripts\build_fefw.ps1 -Target fefw_rt -BuildDir build\rtdll -CMakeArgs "-DFEFW_RT_DLL=ON" -Jobs 4
      - name: Hashes
        shell: pwsh
        run: Get-ChildItem game-build\fefw\build\rtdll -File | Where-Object { $_.Extension -in '.dll', '.lib' } | Get-FileHash -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: fefw_rt
          path: |
            game-build/fefw/build/rtdll/fefw_rt.dll
            game-build/fefw/build/rtdll/fefw_rt.lib
          if-no-files-found: error
